# Datomic Pro transactor, SQL storage, classroom sizing.
# Start with:  bin/transactor /path/to/infra/pg-transactor.properties
#
# NOTE: the properties file must be the LAST argument. If you pass any
# JVM flag to bin/transactor, it DROPS its own GC defaults — re-specify
# -XX:+UseG1GC -XX:MaxGCPauseMillis=50 yourself. (Session 1, sizing.)

protocol=sql
host=localhost
port=4334

sql-url=jdbc:postgresql://localhost:5432/datomic
sql-user=datomic
sql-password=datomic
sql-driver-class=org.postgresql.Driver

# -Xmx1g development sizing. Production on a 4g heap: 32m / 512m / 1g.
memory-index-threshold=32m
memory-index-max=256m
object-cache-max=128m

# Session 3: uncomment, restart, and watch the shared tier fill up.
# memcached=localhost:11211
