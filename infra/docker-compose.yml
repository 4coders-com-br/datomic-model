# Lab infrastructure for the Datomic in Production class.
#
#   docker compose -f infra/docker-compose.yml up -d                  # session 1
#   docker compose -f infra/docker-compose.yml --profile cache up -d  # session 3
#
# Postgres is Datomic's storage service; memcached is the shared cache
# tier we add in session 3. Nothing here holds state you care about —
# `down -v` and start over any time.
#
# After `up`, create the Datomic storage schema with the scripts that
# ship in the Datomic distribution (see infra/README.md).
services:
  postgres:
    image: postgres:16
    container_name: datomic-pg
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    # Host port is overridable so it can coexist with another local
    # Postgres:  PG_PORT=5440 docker compose ... up -d
    # (then match sql-url in the transactor properties and your URIs)
    ports: ["${PG_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  memcached:
    image: memcached:1.6
    container_name: datomic-memcached
    command: ["-m", "256"]
    ports: ["11211:11211"]
    profiles: ["cache"]
