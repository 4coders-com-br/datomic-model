# Datomic Pro transactor — STANDBY.
#
# The second half of the HA pair for the operations class (§2).
# Start it AFTER infra/pg-transactor.properties is already running:
#
#   $DATOMIC/bin/transactor infra/pg-transactor-standby.properties
#
# It starts, discovers that the active transactor holds the lease in
# storage, and parks. A standby that is working correctly prints nothing
# after startup — no URI banner, no errors.
#
# The only differences from pg-transactor.properties are `port` and
# host identity. Everything else, `sql-url` above all, must be
# identical: the shared storage is what makes these two processes one
# logical transactor. A different sql-url produces a second database,
# not a standby.
#
# Same JVM trap as the active: pass any JVM flag to bin/transactor and
# it drops its own GC defaults. Re-specify
#   -XX:+UseG1GC -XX:MaxGCPauseMillis=50
# yourself if you pass anything at all.

protocol=sql
host=localhost
port=4335

sql-url=jdbc:postgresql://localhost:5432/datomic
sql-user=datomic
sql-password=datomic
sql-driver-class=org.postgresql.Driver

# Identical sizing to the active. A standby sized smaller than the
# transactor it replaces changes latency at the moment it takes over.
memory-index-threshold=32m
memory-index-max=256m
object-cache-max=128m

# Uncomment on BOTH transactors together if you are using the shared
# cache tier.
# memcached=localhost:11211
